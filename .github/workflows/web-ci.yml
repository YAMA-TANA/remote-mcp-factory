name: Web CI

on:
  pull_request:
    paths:
      - 'web/**'
      - 'src/entry.ts'
      - 'src/types.ts'
      - 'scripts/test-picosvc-workspace.mjs'
      - 'scripts/test-picosvc-service-studios.mjs'
      - 'scripts/test-picosvc-mcp-management-ui.mjs'
      - 'scripts/test-picosvc-advanced-operations.mjs'
      - 'scripts/test-picosvc-forms-management.mjs'
      - 'scripts/test-picosvc-license-management.mjs'
      - 'scripts/test-picosvc-flags-management.mjs'
      - 'scripts/test-picosvc-json-management.mjs'
      - 'scripts/test-picosvc-files-management.mjs'
      - 'scripts/test-picosvc-creation.mjs'
      - 'scripts/test-picosvc-icons.mjs'
      - 'scripts/test-picosvc-discovery.mjs'
      - 'scripts/test-picosvc-public-product-pages.mjs'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main, next-pages-ui]
    paths:
      - 'web/**'
      - 'src/entry.ts'
      - 'src/types.ts'
      - 'scripts/test-picosvc-workspace.mjs'
      - 'scripts/test-picosvc-service-studios.mjs'
      - 'scripts/test-picosvc-mcp-management-ui.mjs'
      - 'scripts/test-picosvc-advanced-operations.mjs'
      - 'scripts/test-picosvc-forms-management.mjs'
      - 'scripts/test-picosvc-license-management.mjs'
      - 'scripts/test-picosvc-flags-management.mjs'
      - 'scripts/test-picosvc-json-management.mjs'
      - 'scripts/test-picosvc-files-management.mjs'
      - 'scripts/test-picosvc-creation.mjs'
      - 'scripts/test-picosvc-icons.mjs'
      - 'scripts/test-picosvc-discovery.mjs'
      - 'scripts/test-picosvc-public-product-pages.mjs'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: node --experimental-strip-types ../scripts/test-picosvc-workspace.mjs
      - run: node ../scripts/test-picosvc-service-studios.mjs
      - run: node ../scripts/test-picosvc-mcp-management-ui.mjs
      - run: node ../scripts/test-picosvc-advanced-operations.mjs
      - run: node ../scripts/test-picosvc-forms-management.mjs
      - run: node ../scripts/test-picosvc-license-management.mjs
      - run: node --experimental-strip-types ../scripts/test-picosvc-flags-management.mjs
      - run: node ../scripts/test-picosvc-json-management.mjs
      - run: node --experimental-strip-types ../scripts/test-picosvc-files-management.mjs
      - run: node ../scripts/test-picosvc-icons.mjs
      - run: node --experimental-strip-types ../scripts/test-picosvc-discovery.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_FACTORY_API_URL: https://factory.example.workers.dev
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      - run: node ../scripts/test-picosvc-public-product-pages.mjs
      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          for locale in en ja zh-cn; do
            test -f "out/$locale/index.html"
            test -f "out/$locale/pricing/index.html"
            test -f "out/$locale/dashboard/index.html"
            test -f "out/$locale/docs/index.html"
            for service in mcp mock hooks rss mail shot fetch qr cron functions json files license flags monitor forms; do
              test -f "out/$locale/$service/index.html"
              test -f "out/$locale/$service/app/index.html"
              test -f "out/$locale/docs/$service/index.html"
            done
          done
          for icon in picosvc mock mcp hooks rss mail shot fetch qr cron functions json files license flags monitor forms; do
            test -f "out/icons/$icon.svg"
          done
          grep -q 'https://picosvc.com/ja/' out/ja/index.html
          grep -q 'https://picosvc.com/ja/hooks/' out/ja/hooks/index.html
          grep -qi 'hreflang="en"' out/ja/pricing/index.html
          grep -qi 'hreflang="ja"' out/ja/pricing/index.html
          grep -qi 'hreflang="zh-CN"' out/ja/pricing/index.html
          grep -Fq 'Bundle Pico' out/en/pricing/index.html
          grep -Fq 'Bundle Pro' out/en/pricing/index.html
          grep -Fq 'PicoPlus' out/en/pricing/index.html
          grep -Fq 'SERVICE QUOTAS' out/en/pricing/index.html
          grep -q 'https://picosvc.com/sitemap.xml' out/robots.txt

name: External v1 stdio edge proof

on:
  push:
    branches: [edge-compiler-poc]
    paths:
      - 'scripts/edge-proof-v1-spaces.mjs'
      - '.github/workflows/edge-proof-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Automatically convert external v1 stdio MCP and smoke test on workerd
        run: node scripts/edge-proof-v1-spaces.mjs
      - name: Commit proof report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/edge-proof-v1-spaces.json reports/edge-proof-v1-spaces.md
          git diff --cached --quiet || git commit -m "Record external v1 MCP edge proof"
          git push

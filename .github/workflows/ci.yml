name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: node --experimental-strip-types scripts/test-github-app-crypto.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-pricing.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-margin.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-services.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-utility-advanced.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-json-advanced.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-license-advanced.mjs
      - run: node --experimental-sqlite scripts/test-picosvc-files-access.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-mail-mime.mjs
      - run: node --experimental-sqlite scripts/test-picosvc-mail-delivery.mjs
      - run: node --experimental-sqlite scripts/test-picosvc-mail-retry-cap.mjs
      - run: node --experimental-sqlite --experimental-strip-types scripts/test-picosvc-cron-advanced.mjs
      - run: node --experimental-sqlite scripts/test-picosvc-functions-advanced.mjs
      - run: node --experimental-sqlite scripts/test-picosvc-migrations.mjs

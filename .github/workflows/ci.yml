name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: node --experimental-strip-types scripts/test-github-app-crypto.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-pricing.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-services.mjs

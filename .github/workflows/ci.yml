name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/test-picosvc-docs.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-usage-console.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-fleet-consoles.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-mcp-fleet.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-resource-desks.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-operations-desks.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-customer-desks.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-flags-files-desks.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-json-hooks-desks.mjs
      - run: node --experimental-strip-types scripts/test-github-app-crypto.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-pricing.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-margin.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-services.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-utility-advanced.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-shot-quality.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-public-url.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-bounded-fetch.mjs
      - run: node --experimental-sqlite scripts/test-picosvc-onboarding.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-monitor-draft.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-json-advanced.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-license-advanced.mjs
      - run: node --experimental-sqlite scripts/test-picosvc-flags-advanced.mjs
      - run: node --experimental-sqlite scripts/test-picosvc-files-access.mjs
      - run: node --experimental-strip-types scripts/test-picosvc-mail-mime.mjs
      - run: node --experimental-sqlite scripts/test-picosvc-mail-delivery.mjs
      - run: node --experimental-sqlite scripts/test-picosvc-mail-retry-cap.mjs
      - run: node --experimental-sqlite --experimental-strip-types scripts/test-picosvc-cron-advanced.mjs
      - run: node --experimental-sqlite scripts/test-picosvc-functions-advanced.mjs
      - run: node --experimental-sqlite scripts/test-picosvc-forms-advanced.mjs
      - run: node --experimental-sqlite --experimental-strip-types scripts/test-picosvc-forms-pagination.mjs
      - run: node --experimental-sqlite scripts/test-picosvc-monitor-advanced.mjs
      - run: node --experimental-sqlite scripts/test-picosvc-mcp-observability.mjs
      - run: node --experimental-sqlite scripts/test-picosvc-migrations.mjs

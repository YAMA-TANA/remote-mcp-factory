name: Edge compiler proof

on:
  push:
    branches: [edge-compiler-poc]
    paths:
      - 'scripts/edge-proof.mjs'
      - '.github/workflows/edge-proof.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Compile CALCULATE_MCP to Worker and run MCP smoke test
        run: node scripts/edge-proof.mjs
      - name: Commit proof report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/edge-proof.json reports/edge-proof.md
          git diff --cached --quiet || git commit -m "Record MCP edge compiler proof"
          git push
